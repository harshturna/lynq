name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:15.8.1.111
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      postgrest:
        image: postgrest/postgrest:v12.2.12
        env:
          PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_JWT_SECRET: lynq-e2e-jwt-secret-must-be-at-least-32-chars
        ports:
          - 54331:3000
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
